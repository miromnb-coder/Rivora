name: Workspace UI synthetic browser
on:
  pull_request:
    paths: ['app/**', 'components/**', 'lib/workspace-navigation.ts', 'tests/**', 'scripts/workspace-ui-server.mjs', 'playwright.workspace.config.ts', '.github/workflows/workspace-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: List selected Workspace cases
        run: npx playwright test --config playwright.workspace.config.ts --list
      - name: Test real Workspace components with synthetic data
        run: npx playwright test --config playwright.workspace.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-report
          path: |
            workspace-report/
            workspace-test-results/
          retention-days: 14
