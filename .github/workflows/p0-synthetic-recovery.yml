name: P0 synthetic PostgreSQL recovery

# Synthetic PR checks; no production secrets, artifacts or deployment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p0-synthetic-recovery.yml'
      - 'scripts/test-catalogue-*'
      - 'scripts/test-p0-*'
      - 'tests/fixtures/catalogue-*.sql'
      - 'tests/fixtures/p0-*.sql'
      - 'supabase/tests/catalogue_integrity.sql'
      - 'supabase/migrations/20261010140726_catalogue_integrity_guided_import.sql'
      - 'lib/rivora/p0-diagnostics.ts'
      - 'app/api/support/operator/diagnostics/**'
      - 'tests/p0-diagnostics.test.ts'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install synthetic test tools
        run: sudo apt-get update && sudo apt-get install -y age ripgrep
      - name: Start isolated synthetic PostgreSQL 17.6
        run: |
          docker run --detach --name averomira-catalogue-test --network none \
            --memory 1g --cpus 2 --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6
          for attempt in $(seq 1 20); do
            if docker exec averomira-catalogue-test pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:catalogue:sql
      - run: node scripts/test-catalogue-concurrency.mjs
      - name: Synthetic database logical backup and restore
        run: bash scripts/test-p0-native-recovery.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Remove synthetic container
        if: always()
        run: docker rm --force averomira-catalogue-test averomira-p0-restored || true
